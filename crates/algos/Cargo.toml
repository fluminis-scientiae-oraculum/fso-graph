[package]
name = "fso-graph"
version = "0.3.2"
description = "A library of high-performant graph algorithms. Community-maintained fork of graph."
keywords = ["graph", "algorithms", "parallel"]
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fso_graph"

[dependencies]
ahash.workspace = true
atomic_float.workspace = true
clap = { workspace = true, optional = true }
fso-graph-builder = { path = "../builder", version = "^0.4.1" }
log.workspace = true
num-format.workspace = true
nanorand.workspace = true
rayon.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
env_logger.workspace = true
fso-graph-builder = { path = "../builder", version = "^0.4.1", features = ["gdl"] }
log.workspace = true
polars.workspace = true

[lints]
workspace = true
